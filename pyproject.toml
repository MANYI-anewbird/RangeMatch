[project]
name = "rangematch"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "shapely>=2.0",
  "pyproj>=3.6",
  "pyshp>=2.3",
  "certifi>=2024.0.0",
  "jsonschema>=4.22.0",
  "referencing>=0.35.0",
]

[project.optional-dependencies]
live = [
  "numpy>=1.26",
  "netCDF4>=1.6.5",
  "rasterio>=1.3.10",
]
api = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "httpx>=0.27.0",
  "jsonschema>=4.22.0",
  "numpy>=1.26",
  "netCDF4>=1.6.5",
  "rasterio>=1.3.10",
  "fpdf2>=2.8.0",
]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]

