[project]
name = "rangematch"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "shapely>=2.0",
  "pyproj>=3.6",
  "pyshp>=2.3",
  "certifi>=2024.0.0",
]

[project.optional-dependencies]
api = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "httpx>=0.27.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]

