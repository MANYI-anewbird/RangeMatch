test_suite_id: RANGEMATCH_F07_ROAD_PHYSICAL_ACCESS_GOLDEN_TESTS
rule_spec_version: 0.1.0
derivation_spec_version: 0.1.0
status: APPROVED_V0_1_FOR_IMPLEMENTATION
implementation_status: IMPLEMENTED_V0_1
executable_suite: tests/test_f07_derivation.py

shared_expectations:
  ranking_effect: NONE
  legal_access_inferred_from_mapped_roads: false
  distance_or_mtfcc_suitability_threshold: false
  cow_sheep_signal_divergence_from_f07_alone: false
  planar_lon_lat_degree_distance: prohibited
  silent_first_feature_or_auto_union: prohibited
  osm_consulted_in_v0_1: false
  canonical_source_id: US_CENSUS_TIGER_LINE_2025_ALL_ROADS
  edges_treated_as_equivalent_to_all_roads: false

cases:
  - test_id: F07_TEST_001
    description: Usable road extract with contact/distance yields CONTEXT_DEPENDENT and ranking_effect NONE.
    input_quality_state: ROAD_CONTEXT_COMPLETE
    expected:
      cow_calf_signal: CONTEXT_DEPENDENT
      sheep_signal: CONTEXT_DEPENDENT
      ranking_effect: NONE
      explanation_code: F07_EXPL_CONTEXT_ONLY
      legal_access_claimed: false

  - test_id: F07_TEST_002
    description: Empty search window is context, not REJECT or landlocked certainty.
    input_quality_state: NO_MAPPED_ROAD_IN_SEARCH_WINDOW
    expected:
      cow_calf_signal: CONTEXT_DEPENDENT
      sheep_signal: CONTEXT_DEPENDENT
      ranking_effect: NONE
      explanation_code: F07_EXPL_NO_MAPPED_ROAD_IN_WINDOW
      decision_label_from_f07_alone: HOLD_OR_UNCHANGED
      landlocked_certainty: false
      reject_emitted: false

  - test_id: F07_TEST_003
    description: Missing road/parcel inputs remain UNKNOWN.
    input_quality_state: MISSING
    expected:
      cow_calf_signal: UNKNOWN
      sheep_signal: UNKNOWN
      ranking_effect: NONE
      explanation_code: F07_EXPL_MISSING

  - test_id: F07_TEST_004
    description: Incomplete road provenance needs verification.
    input_quality_state: ROAD_SOURCE_INCOMPLETE
    expected:
      cow_calf_signal: NEEDS_VERIFICATION
      sheep_signal: NEEDS_VERIFICATION
      ranking_effect: NONE
      explanation_code: F07_EXPL_SOURCE_INCOMPLETE

  - test_id: F07_TEST_005
    description: CRS unsupported needs verification; no silent arbitrary projection.
    input_quality_state: CRS_UNSUPPORTED
    expected:
      cow_calf_signal: NEEDS_VERIFICATION
      sheep_signal: NEEDS_VERIFICATION
      ranking_effect: NONE
      explanation_code: F07_EXPL_CRS_UNSUPPORTED
      silent_arbitrary_projection: false

  - test_id: F07_TEST_006
    description: OSM is deferred from F07 v0.1 and must not be consulted as secondary QA.
    input:
      osm_secondary_qa_enabled: false
      canonical_source_id: US_CENSUS_TIGER_LINE_2025_ALL_ROADS
    expected:
      osm_consulted: false
      osm_averaged_with_tiger: false
      ranking_effect: NONE

  - test_id: F07_TEST_007
    description: INTERSECTS contact preserves topology detail; geometric only.
    input:
      nearest_mapped_road_distance_m: 0
      road_parcel_contact_status: INTERSECTS
    expected:
      geometric_contact: true
      contact_detail: INTERSECTS
      legal_access_inferred: false
      usable_entrance_inferred: false
      ranking_effect: NONE

  - test_id: F07_TEST_008
    description: Positive distance is Euclidean centerline context, not network drive distance.
    input:
      nearest_mapped_road_distance_m: 250.0
      method: PROJECTED_EUCLIDEAN_POLYGON_TO_LINE
    expected:
      network_drive_distance_claimed: false
      travel_time_claimed: false
      suitability_class: null
      ranking_effect: NONE

  - test_id: F07_TEST_009
    description: Search window is an adapter parameter, not a too-far threshold.
    input:
      search_window_m: 5000
      mapped_road_feature_count_in_search_window: 0
    expected:
      search_window_is_suitability_threshold: false
      explanation_code: F07_EXPL_NO_MAPPED_ROAD_IN_WINDOW
      diligence_action: F07_DIL_002

  - test_id: F07_TEST_010
    description: Geometry hash change invalidates prior F07 road measurements.
    input:
      prior_geometry_hash: aaa
      new_geometry_hash: bbb
    expected:
      reuse_prior_distance_or_contact: false
      recompute_required: true

  - test_id: F07_TEST_011
    description: Planar lon/lat degree distance is prohibited.
    input:
      source_crs: EPSG:4326
      attempted_method: PLANAR_DEGREE_DISTANCE
    expected:
      method_allowed: false
      factor_signal_if_only_degree_planar: NEEDS_VERIFICATION

  - test_id: F07_TEST_012
    description: Cross-county All-Roads coverage incomplete → PARTIAL/UNKNOWN → NEEDS_VERIFICATION; no silent measure.
    input:
      search_window_m: 5000
      requested_county_fips: ["08069", "08087"]
      loaded_county_fips: ["08069"]
      input_quality_state: PARTIAL
    expected:
      cow_calf_signal: NEEDS_VERIFICATION
      sheep_signal: NEEDS_VERIFICATION
      ranking_effect: NONE
      explanation_code: F07_EXPL_SOURCE_INCOMPLETE
      silent_distance_or_contact_measure: false
      requested_county_fips_recorded: true
      loaded_county_fips_recorded: true

  - test_id: F07_TEST_013
    description: Cross-county All-Roads coverage complete allows ROAD_CONTEXT_COMPLETE measurement path.
    input:
      search_window_m: 5000
      requested_county_fips: ["08069", "08087"]
      loaded_county_fips: ["08069", "08087"]
      input_quality_state: ROAD_CONTEXT_COMPLETE
    expected:
      cow_calf_signal: CONTEXT_DEPENDENT
      sheep_signal: CONTEXT_DEPENDENT
      ranking_effect: NONE
      explanation_code: F07_EXPL_CONTEXT_ONLY
      county_coverage_complete: true
      requested_county_fips_recorded: true
      loaded_county_fips_recorded: true

  - test_id: F07_TEST_014
    description: Equal-distance nearest-road tie broken by stable feature ID ascending (LINEARID preferred).
    input:
      roads:
        - feature_id: "110500012345"
          linearid: "110500012345"
          distance_m: 100.0
        - feature_id: "110500067890"
          linearid: "110500067890"
          distance_m: 100.0
      tie_break_policy: [distance_m_ascending, stable_feature_id_ascending]
    expected:
      nearest_mapped_road_distance_m: 100.0
      nearest_road_feature_id: "110500012345"
      ranking_effect: NONE

  - test_id: F07_TEST_015
    description: TOUCHES contact is preserved distinctly from INTERSECTS.
    input:
      nearest_mapped_road_distance_m: 0
      road_parcel_contact_status: TOUCHES
    expected:
      contact_detail: TOUCHES
      contact_detail_not_collapsed_to_intersects_only: true
      optional_combined_summary_allowed: true
      combined_summary_may_replace_detail: false
      legal_access_inferred: false
      ranking_effect: NONE

prohibited_behavior_tests:
  - test_id: F07_NEG_001
    description: Mapped road contact must not create ADVANCE.
    prohibited: advance_from_road_contact

  - test_id: F07_NEG_002
    description: Empty mapped-road window must not create REJECT or landlocked certainty.
    prohibited: reject_or_landlocked_from_empty_window

  - test_id: F07_NEG_003
    description: Distance bands must not become suitability classes.
    prohibited: distance_band_suitability_class

  - test_id: F07_NEG_004
    description: MTFCC/road class must not become suitability classes.
    prohibited: mtfcc_suitability_class

  - test_id: F07_NEG_005
    description: Mapped roads must not establish legal access.
    prohibited: legal_access_from_mapped_roads

  - test_id: F07_NEG_006
    description: F07 must not rank Cow-Calf above Sheep or the reverse.
    prohibited: cow_sheep_ranking_from_f07

  - test_id: F07_NEG_007
    description: Euclidean distance must not be labeled network drive distance or travel time.
    prohibited: network_or_travel_time_from_euclidean_only

  - test_id: F07_NEG_008
    description: F07 must not claim F08 woody/shrub structure or F03 livestock-water access routes.
    prohibited: cross_factor_substitution_claims

  - test_id: F07_NEG_009
    description: Incomplete county All-Roads coverage must not silently measure.
    prohibited: silent_measure_under_incomplete_county_coverage

  - test_id: F07_NEG_010
    description: Edges road-filtered must not be treated as equivalent to All Roads without separate versioning.
    prohibited: edges_as_equivalent_to_all_roads

  - test_id: F07_NEG_011
    description: OSM must not be used as secondary QA in F07 v0.1.
    prohibited: osm_secondary_qa_in_v0_1
