test_suite_id: RANGEMATCH_F06_PARCEL_CONFIGURATION_GOLDEN_TESTS
rule_spec_version: 0.1.0
derivation_spec_version: 0.1.0
status: APPROVED_CONTRACT_FOR_IMPLEMENTATION
implementation_status: IMPLEMENTED_V0_1_INPUT_BOUNDARIES_PATCHED
executable_suite: tests/test_f06_derivation.py
freeze_gate: PENDING_HUMAN_RECHECK_AFTER_INPUT_BOUNDARY_FIXES

shared_expectations:
  ranking_effect: NONE
  suitability_threshold_on_area_or_compactness: false
  cow_sheep_signal_divergence_from_f06_alone: false
  planar_lon_lat_degrees_measurement: prohibited

cases:
  - test_id: F06_TEST_001
    description: Valid measurable geometry yields CONTEXT_DEPENDENT with ranking_effect NONE.
    input_quality_state: PARCEL_GEOMETRY_COMPLETE
    expected:
      cow_calf_signal: CONTEXT_DEPENDENT
      sheep_signal: CONTEXT_DEPENDENT
      ranking_effect: NONE
      explanation_code: F06_EXPL_CONTEXT_ONLY

  - test_id: F06_TEST_002
    description: Missing geometry remains UNKNOWN.
    input_quality_state: MISSING
    expected:
      cow_calf_signal: UNKNOWN
      sheep_signal: UNKNOWN
      ranking_effect: NONE
      explanation_code: F06_EXPL_MISSING

  - test_id: F06_TEST_003
    description: Empty or invalid unusable geometry needs verification, not land failure.
    input_quality_state: GEOMETRY_INVALID_OR_EMPTY
    expected:
      cow_calf_signal: NEEDS_VERIFICATION
      sheep_signal: NEEDS_VERIFICATION
      ranking_effect: NONE
      explanation_code: F06_EXPL_GEOMETRY_UNUSABLE
      land_unsuitable_inferred: false

  - test_id: F06_TEST_004
    description: UTM zone crossing / unsupported CRS selection needs verification.
    input_quality_state: CRS_UNSUPPORTED
    expected:
      cow_calf_signal: NEEDS_VERIFICATION
      sheep_signal: NEEDS_VERIFICATION
      ranking_effect: NONE
      explanation_code: F06_EXPL_CRS_UNSUPPORTED
      silent_arbitrary_projection: false

  - test_id: F06_TEST_005
    description: Incomplete provenance blocks context completeness.
    input_quality_state: PARCEL_INCOMPLETE
    expected:
      cow_calf_signal: NEEDS_VERIFICATION
      sheep_signal: NEEDS_VERIFICATION
      ranking_effect: NONE
      explanation_code: F06_EXPL_INCOMPLETE_PROVENANCE

  - test_id: F06_TEST_006
    description: Conflicting geometry sources need verification.
    input_quality_state: CONFLICTING_SOURCES
    expected:
      cow_calf_signal: NEEDS_VERIFICATION
      sheep_signal: NEEDS_VERIFICATION
      ranking_effect: NONE
      explanation_code: F06_EXPL_CONFLICT

  - test_id: F06_TEST_007
    description: Area and perimeter must not be computed in lon/lat degrees as planar values.
    input:
      source_crs: EPSG:4326
      attempted_method: PLANAR_DEGREE_AREA
    expected:
      method_allowed: false
      factor_signal_if_only_degree_planar: NEEDS_VERIFICATION

  - test_id: F06_TEST_008
    description: Compactness uses frozen isoperimetric quotient and creates no threshold class.
    input:
      area_m2: 10000
      perimeter_m: 400
      formula: C = 4 * pi * A / P^2
    expected:
      compactness_approx: 0.7853981633974483
      suitability_class: null
      ranking_effect: NONE

  - test_id: F06_TEST_009
    description: Multi-part geometry remains context; not automatic REJECT or species divergence.
    input:
      polygon_part_count: 2
      input_quality_state: PARCEL_GEOMETRY_COMPLETE
    expected:
      cow_calf_signal: CONTEXT_DEPENDENT
      sheep_signal: CONTEXT_DEPENDENT
      ranking_effect: NONE
      diligence_action: F06_DIL_002

  - test_id: F06_TEST_010
    description: Geometry hash change invalidates prior F06 measurements.
    input:
      prior_geometry_hash: aaa
      new_geometry_hash: bbb
    expected:
      reuse_prior_area_perimeter: false
      recompute_required: true

  - test_id: F06_TEST_011
    description: FeatureCollection with zero Features needs verification.
    input:
      geojson_type: FeatureCollection
      feature_count: 0
    expected:
      cow_calf_signal: NEEDS_VERIFICATION
      sheep_signal: NEEDS_VERIFICATION
      silent_first_feature_measurement: false

  - test_id: F06_TEST_012
    description: FeatureCollection with exactly one Feature is measurable.
    input:
      geojson_type: FeatureCollection
      feature_count: 1
    expected:
      cow_calf_signal: CONTEXT_DEPENDENT
      sheep_signal: CONTEXT_DEPENDENT
      ranking_effect: NONE

  - test_id: F06_TEST_013
    description: FeatureCollection with multiple Features is not silently reduced to features[0].
    input:
      geojson_type: FeatureCollection
      feature_count: 2
    expected:
      cow_calf_signal: NEEDS_VERIFICATION
      sheep_signal: NEEDS_VERIFICATION
      silent_first_feature_measurement: false
      automatic_union: false

  - test_id: F06_TEST_014
    description: Non-EPSG:4326 source_crs is unsupported in v0.1.
    input:
      source_crs: EPSG:32613
    expected:
      cow_calf_signal: NEEDS_VERIFICATION
      sheep_signal: NEEDS_VERIFICATION
      explanation_code: F06_EXPL_CRS_UNSUPPORTED
      area_m2: null

  - test_id: F06_TEST_015
    description: Longitude/latitude bounds outside valid WGS84 or UTM-supported range need verification.
    input:
      cases: [LON_OUTSIDE_PM180, LAT_OUTSIDE_UTM_SUPPORT]
    expected:
      cow_calf_signal: NEEDS_VERIFICATION
      sheep_signal: NEEDS_VERIFICATION
      explanation_code: F06_EXPL_CRS_UNSUPPORTED

prohibited_behavior_tests:
  - test_id: F06_NEG_001
    description: Acreage must not create ADVANCE/HOLD/REJECT thresholds.
    prohibited: acreage_threshold_decision_label

  - test_id: F06_NEG_002
    description: Compactness must not create suitability classes.
    prohibited: compactness_suitability_class

  - test_id: F06_NEG_003
    description: Perimeter must not become fencing cost.
    prohibited: fencing_cost_from_perimeter

  - test_id: F06_NEG_004
    description: Area must not become carrying capacity.
    prohibited: carrying_capacity_from_area

  - test_id: F06_NEG_005
    description: F06 must not rank Cow-Calf above Sheep or the reverse.
    prohibited: cow_sheep_ranking_from_f06

  - test_id: F06_NEG_006
    description: F06 must not claim road or physical access (F07).
    prohibited: f07_access_inference_from_f06
