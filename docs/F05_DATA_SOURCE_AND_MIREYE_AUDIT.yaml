mireye_v0_14_0_catalog_findings:
  inspected_fixture: mireye/fixtures/field_catalog_v0.14.0.json
  matched_fields:
    - field_id: drought_category
      source: USDM_CURRENT
      spatial_semantics: POINT
      temporal_semantics: CURRENT_WEEKLY_SNAPSHOT
      f05_mapping: VAR_F05_DROUGHT_MONITOR_CATEGORY
      may_represent_climatology: false
      cper_live_value: D3
      null_meaning_caution: >-
        Catalog states null may mean not currently in a drought polygon or a
        failed/stale read. Runtime must not collapse those cases.
    - field_id: mean_annual_dry_bulb_temperature_degc
      source: NOAA_NCEI_NORMALS_GRIDDED
      spatial_semantics: POINT
      temporal_semantics: NORMALS_1991_2020
      f05_mapping: VAR_F05_MEAN_ANNUAL_TEMPERATURE
      may_represent_whole_parcel: false
      cper_live_value_degc: 9.12
    - field_id: days_above_32c_annual_count
      source: NOAA_NCEI_NCLIMGRID_DAILY
      spatial_semantics: POINT
      temporal_semantics: ANNUAL_COUNT_PRODUCT_DEFINED
      f05_mapping: VAR_F05_HEAT_DAYS_ABOVE_32C
      biological_threshold_approved: false
      cper_live_value_days: 32
  non_equivalent_fields:
    - field_id: precipitable_water_annual_mean_cm
      reason: Atmospheric column water vapor for irradiance attenuation, not land-surface rainfall.
      f05_mapping: PROHIBITED_AS_PRECIPITATION
  catalog_gaps:
    - No verified land-surface mean annual precipitation field found in v0.14.0 catalog snapshot.
    - No multi-year drought-frequency summary field found; history must come from external reconstruction or repeated USDM archives.
    - No parcel-aggregate climate contract verified yet; current Mireye climate fields are point semantics.

