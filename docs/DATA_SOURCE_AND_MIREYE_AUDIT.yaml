fields:
  - variable_id: VAR_F01_SLOPE_POINT
    scientifically_required: true
    mireye_field: slope_degrees
    availability: VERIFIED
    directness: MIREYE_POINT_FIELD_SOURCE_DERIVED_FROM_TERRAIN_DATA
    parcel_derivation_required: true
    external_source_candidate: USGS_3DEP
    live_test_value: {value: 0.9686843752861023, unit: degrees, confidence: medium}
    live_test_source: USGS_3DEP_COG
    live_test_dataset_vintage: null
    limitation: A point value cannot represent parcel slope distribution; the live response supplied no dataset vintage for this derived field.

  - variable_id: VAR_F01_SLOPE_DISTRIBUTION
    scientifically_required: true
    mireye_field: null
    availability: NOT_VERIFIED_AS_DIRECT_FIELD
    directness: PARCEL_DERIVATION_REQUIRED
    external_source_candidate: USGS_3DEP
    limitation: Requires parcel geometry, USGS 3DEP coverage, declared projection/resolution, and deterministic aggregation under the versioned F01 derivation spec.

  - variable_id: VAR_F01_TERRAIN_RUGGEDNESS
    scientifically_required: true
    mireye_field: null
    availability: NOT_VERIFIED
    directness: DERIVATION_REQUIRED
    external_source_candidate: USGS_3DEP
    limitation: Algorithm, neighborhood, resolution, and aggregation remain method-review items and are not frozen in derivation spec v0.1.0.

  - variable_id: VAR_F01_TOPOGRAPHIC_POSITION
    scientifically_required: true
    mireye_field: null
    availability: NOT_VERIFIED
    directness: DERIVATION_REQUIRED
    external_source_candidate: USGS_3DEP
    limitation: Classification method and neighborhood scale remain method-review items and are not frozen in derivation spec v0.1.0.

  - variable_id: VAR_F01_ELEVATION
    scientifically_required: true
    mireye_field: elevation
    availability: VERIFIED
    directness: MIREYE_POINT_FIELD_SOURCE_DERIVED_FROM_TERRAIN_DATA
    parcel_derivation_required: true
    external_source_candidate: USGS_3DEP
    live_test_value: {value: 1646.923095703125, unit: meters, confidence: medium}
    live_test_source: USGS_3DEP_COG
    live_test_dataset_vintage: 3DEP 1/3 arc-second seamless DEM
    limitation: The live response did not declare vertical datum; parcel aggregation remains required.

  - variable_id: VAR_F01_ASPECT
    scientifically_required: true
    mireye_fields: [aspect_degrees, aspect_cardinal]
    availability: VERIFIED
    directness: MIREYE_POINT_FIELDS_SOURCE_DERIVED_FROM_TERRAIN_DATA
    parcel_derivation_required: true
    external_source_candidate: USGS_3DEP
    live_test_value: {degrees: 301.71868896484375, cardinal: NW, confidence: medium}
    live_test_source: USGS_3DEP_COG
    live_test_dataset_vintage: null
    limitation: Circular statistics and flat or undefined pixels require explicit handling; point aspect cannot represent a parcel.

mireye_f02_catalog_findings:
  exact_numeric_herbaceous_cover_field_verified: false
  exact_numeric_herbaceous_production_field_verified: false
  exact_rap_field_verified: false
  contextual_point_fields:
    - field: lcms_class
      live_value: Grass/Forb/Herb & Shrubs Mix
      source: USFS_LCMS
      dataset_vintage: USFS LCMS Land_Cover CONUS v2025-11 (2025 annual), ~120 m block-mode CONUS COG
      permitted_use: POINT_LEVEL_LAND_COVER_CONTEXT_AND_QA_ONLY
    - field: cdl_class
      live_value: Grass/Pasture
      source: USDA_NASS_CDL
      dataset_vintage: USDA CDL 2025 (~120 m block-mode CONUS COG)
      permitted_use: POINT_LEVEL_LAND_COVER_CONTEXT_AND_QA_ONLY
  prohibited_inference: >-
    LCMS or CDL categorical point classes must not be converted into herbaceous
    cover, herbaceous production, available forage, palatability, nutritive value,
    carrying capacity, or a parcel-wide F02 signal.

explicit_non_equivalences:
